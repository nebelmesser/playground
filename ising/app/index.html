<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="A live WebGPU Ising model showing emergence across observation scales.">
  <link rel="canonical" href="https://nebelmesser.com/ising/">
  <title>Ising Field — Emergence Across Scales</title>
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <main>
    <canvas id="field" aria-label="An evolving spin field in the two-dimensional Ising model"></canvas>
    <div class="noise" aria-hidden="true"></div>
    <div class="place-labels" id="place-labels" aria-hidden="true"></div>

    <button class="settings-toggle" id="settings-toggle" type="button" aria-label="Open settings" aria-expanded="false" aria-controls="settings-panel">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
      </svg>
      <svg class="close-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
      </svg>
    </button>

    <section class="panel is-closed" id="settings-panel" aria-labelledby="settings-title" aria-hidden="true" inert>
      <h1 class="panel-title" id="settings-title">Ising field settings</h1>

      <div class="control">
        <div class="control-head">
          <label for="scale">Observation scale</label>
          <output id="scale-value" for="scale">1 spin</output>
        </div>
        <input id="scale" type="range" min="0" max="3" value="1.55" step="0.01">
      </div>

      <div class="control">
        <div class="control-head">
          <label for="temperature">Temperature</label>
          <output id="temperature-value" for="temperature">T = 2.27</output>
        </div>
        <input id="temperature" type="range" min="0.8" max="4.5" value="2.27" step="0.01">
      </div>

      <div class="control">
        <div class="control-head">
          <label for="time-speed">Time speed</label>
          <output id="time-speed-value" for="time-speed">1×</output>
        </div>
        <input id="time-speed" type="range" min="1" max="10" value="1" step="0.1">
      </div>

      <div class="control">
        <div class="control-head">
          <label for="brush-size">Brush size</label>
          <output id="brush-size-value" for="brush-size">48 px</output>
        </div>
        <input id="brush-size" type="range" min="4" max="100" value="48" step="4">
      </div>

      <div class="actions">
        <button class="icon-button" id="pause" type="button" aria-label="Pause simulation" aria-pressed="false" title="Pause simulation">
          <svg class="pause-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25v13.5m-7.5-13.5v13.5"/>
          </svg>
          <svg class="play-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-1.427 1.529-2.33 2.779-1.643l11.54 6.347c1.295.712 1.295 2.573 0 3.286L8.03 19.99c-1.25.687-2.779-.217-2.779-1.643V5.653Z"/>
          </svg>
        </button>
        <button class="icon-button" id="restart" type="button" aria-label="New random state" title="New random state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3"/>
          </svg>
        </button>
        <button class="icon-button clear-button" id="clear-blue" type="button" aria-label="Clear to blue" title="Clear to blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.53 16.122a3 3 0 0 0-5.78 1.128 2.25 2.25 0 0 1-2.4 2.245 4.5 4.5 0 0 0 8.4-2.245c0-.399-.078-.78-.22-1.128Zm0 0a15.998 15.998 0 0 0 3.388-1.62m-5.043-.025a15.998 15.998 0 0 1 1.622-3.395m3.42 3.42a15.995 15.995 0 0 0 4.764-4.648l3.876-5.814a1.151 1.151 0 0 0-1.597-1.597L14.147 6.32a15.996 15.996 0 0 0-4.65 4.763m3.42 3.42a6.776 6.776 0 0 0-3.42-3.42"/>
          </svg>
        </button>
        <label class="labels-option" for="show-labels">
          <input id="show-labels" type="checkbox" checked>
          <span>Domain names</span>
        </label>
      </div>

      <dl class="stats">
        <div class="stat"><dt>phase</dt><dd id="phase">critical</dd></div>
        <div class="stat"><dt>|magnetization|</dt><dd id="magnetization">0.000</dd></div>
        <div class="stat"><dt>energy</dt><dd id="energy">0.000</dd></div>
      </dl>
    </section>

    <div class="scale-dock" role="group" aria-label="Observation scale">
      <output class="scale-readout" id="scale-readout" for="scale-dock">1 spin</output>
      <button class="scale-paddle rough-paddle" id="rough" type="button" aria-pressed="false">
        <svg class="paddle-frame" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M16 2 H98 V38 H16 L6 27 Q1 23 1 20 Q1 17 6 13 Z" /></svg>
        <span class="paddle-label">Rough</span>
      </button>
      <input id="scale-dock" type="range" min="0" max="3" value="1.55" step="0.01" aria-label="Observation scale">
      <button class="scale-paddle smooth-paddle" id="smooth" type="button" aria-pressed="false">
        <svg class="paddle-frame" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M2 2 H84 L94 13 Q99 17 99 20 Q99 23 94 27 L84 38 H2 Z" /></svg>
        <span class="paddle-label">Smooth</span>
      </button>
    </div>

    <div class="temperature-paddles" role="group" aria-label="Temporary temperature controls">
      <button class="temperature-paddle cool-paddle" id="cool" type="button" aria-pressed="false">
        <svg class="paddle-frame" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M16 2 H98 V38 H16 L6 27 Q1 23 1 20 Q1 17 6 13 Z" /></svg>
        <span class="paddle-progress" aria-hidden="true"></span>
        <span class="paddle-label">Cool</span>
      </button>
      <button class="temperature-paddle heat-paddle" id="heat" type="button" aria-pressed="false">
        <svg class="paddle-frame" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M2 2 H84 L94 13 Q99 17 99 20 Q99 23 94 27 L84 38 H2 Z" /></svg>
        <span class="paddle-progress" aria-hidden="true"></span>
        <span class="paddle-label">Heat</span>
      </button>
    </div>

    <div class="hint">Wheel or pinch: scale · [ ]: brush</div>
    <div class="legend"><span>−1</span><i></i><span>+1</span></div>
    <div class="fatal-error" id="fatal-error" hidden></div>
  </main>
</body>
</html>
