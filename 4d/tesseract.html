    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

    <script type="module">
        import * as THREE from 'three';

        const AXIS_HUD_W = 280;
        const AXIS_HUD_H = 200;
        const AXIS_HUD_SCALE = 108;
        let projectionDistance = 3;
        const DRAG_SENSITIVITY = 0.008;
        const WHEEL_SENSITIVITY = 0.0015;
        const WHEEL_PAN_SENSITIVITY = 0.006;
        const MAX_SLICES = 16;
        const BLUE = [0.24, 0.55, 1.0];
        const RED = [1.0, 0.30, 0.42];
        const CUBE_FACE_INDICES = [
            0, 2, 6, 0, 6, 4,
            1, 5, 7, 1, 7, 3,
            0, 4, 5, 0, 5, 1,
            2, 3, 7, 2, 7, 6,
            0, 1, 3, 0, 3, 2,
            4, 6, 7, 4, 7, 5,
        ];
        const CUBE_EDGES = [
            [0, 1], [2, 3], [4, 5], [6, 7],
            [0, 2], [1, 3], [4, 6], [5, 7],
            [0, 4], [1, 5], [2, 6], [3, 7],
        ];
        const AXIS_DEFS = [
            { v: [1, 0, 0, 0], label: 'X', color: '#ff4d6d' },
            { v: [0, 1, 0, 0], label: 'Y', color: '#3ddc84' },
            { v: [0, 0, 1, 0], label: 'Z', color: '#4d8dff' },
            { v: [0, 0, 0, 1], label: 'W', color: '#f5c542' },
        ];

        const angles = { xy: 0.35, xz: 0.4, yz: 0.25, xw: 0, yw: 0, zw: -Math.PI / 2 };
        const deviceOrbit = {
            mode: 'xw-yw',
            invert: false,
            locked: false,
            listening: false,
            useGyro: false,
            xz: 0,
            yz: 0,
            targetXz: 0,
            targetYz: 0,
            lastMotionTime: 0,
            prevBeta: null,
            prevGamma: null,
            prevAlpha: null,
            prevRoll: null,
            prevPitch: null,
        };

        function deviceTiltOn() {
            return deviceOrbit.mode !== 'off';
        }

        function resetDeviceOrbit() {
            deviceOrbit.locked = false;
            deviceOrbit.xz = 0;
            deviceOrbit.yz = 0;
            deviceOrbit.targetXz = 0;
            deviceOrbit.targetYz = 0;
            deviceOrbit.prevBeta = null;
            deviceOrbit.prevGamma = null;
            deviceOrbit.prevAlpha = null;
            deviceOrbit.prevRoll = null;
            deviceOrbit.prevPitch = null;
        }

        function forgetDevicePrev() {
            deviceOrbit.prevBeta = null;
            deviceOrbit.prevGamma = null;
            deviceOrbit.prevAlpha = null;
            deviceOrbit.prevRoll = null;
            deviceOrbit.prevPitch = null;
            deviceOrbit.lastMotionTime = 0;
        }

        function lockTiltAxis() {
            if (deviceOrbit.locked) return;
            if (deviceOrbit.mode !== 'xw-yw' && deviceOrbit.mode !== 'zw') return;
            deviceOrbit.locked = true;
            deviceOrbit.targetXz = deviceOrbit.xz;
            deviceOrbit.targetYz = deviceOrbit.yz;
        }

        function unlockTiltAxis() {
            if (!deviceOrbit.locked) return;
            deviceOrbit.targetXz = deviceOrbit.xz;
            deviceOrbit.targetYz = deviceOrbit.yz;
            forgetDevicePrev();
            deviceOrbit.locked = false;
        }

        let viewMode = 'cross';
        let fillCubes = true;
        let showSlices = false;
        let sliceCount = 5;
        let eyeSep = 1;
        let cubeSize = 1;
        const activePointers = new Map();
        let lastMidpoint = null;
        let lastPinchDist = 0;

        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x111111, 8, 22);

        const camera = new THREE.PerspectiveCamera(55, (window.innerWidth / 2) / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 5.4);
        camera.lookAt(0, 0, 0);
        camera.focus = camera.position.z;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x111111, 1);
        renderer.autoClear = false;
        renderer.domElement.classList.add('main-view');
        document.body.appendChild(renderer.domElement);

        const stereoCamera = new THREE.StereoCamera();
        stereoCamera.eyeSep = eyeSep;

        const hudLayout = { w: AXIS_HUD_W, h: AXIS_HUD_H, scale: AXIS_HUD_SCALE };

        function isCompactView() {
            return window.innerHeight < 560 || Math.min(window.innerWidth, window.innerHeight) < 720;
        }

        const axesCanvas = document.getElementById('axesCanvas');
        const axesCtx = axesCanvas.getContext('2d');

        function resizeAxesCanvas() {
            const compact = isCompactView();
            const cssW = compact ? 120 : AXIS_HUD_W;
            const cssH = compact ? 86 : AXIS_HUD_H;
            hudLayout.w = cssW;
            hudLayout.h = cssH;
            hudLayout.scale = compact ? 46 : AXIS_HUD_SCALE;

            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            axesCanvas.style.width = `${cssW}px`;
            axesCanvas.style.height = `${cssH}px`;
            axesCanvas.width = Math.round(cssW * dpr);
            axesCanvas.height = Math.round(cssH * dpr);
            axesCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function cubeCorner(index) {
            return [
                (index & 1) ? 1 : -1,
                (index & 2) ? 1 : -1,
                (index & 4) ? 1 : -1,
            ];
        }

        function colorForObjectW(w) {
            return w < 0 ? BLUE : RED;
        }

        function lerpColor(t) {
            return [
                BLUE[0] + (RED[0] - BLUE[0]) * t,
                BLUE[1] + (RED[1] - BLUE[1]) * t,
                BLUE[2] + (RED[2] - BLUE[2]) * t,
            ];
        }

        const vertices4 = [];
        for (let i = 0; i < 8; i++) {
            const [x, y, z] = cubeCorner(i);
            vertices4.push([x, y, z, -1]);
        }
        for (let i = 0; i < 8; i++) {
            const [x, y, z] = cubeCorner(i);
            vertices4.push([x, y, z, 1]);
        }

        const cubeEdges = [];
        const wEdges = [];
        for (let i = 0; i < vertices4.length; i++) {
            for (let j = i + 1; j < vertices4.length; j++) {
                let diff = 0;
                let wOnly = true;
                for (let k = 0; k < 4; k++) {
                    if (vertices4[i][k] !== vertices4[j][k]) {
                        diff++;
                        if (k !== 3) wOnly = false;
                    }
                }
                if (diff !== 1) continue;
                if (wOnly) wEdges.push([i, j]);
                else cubeEdges.push([i, j]);
            }
        }

        function rotatePlane(a, b, cos, sin) {
            return [a * cos - b * sin, a * sin + b * cos];
        }

        function shortestAngle(delta) {
            return Math.atan2(Math.sin(delta), Math.cos(delta));
        }

        function screenAngleDeg() {
            if (screen.orientation && Number.isFinite(screen.orientation.angle)) {
                return screen.orientation.angle;
            }
            if (Number.isFinite(window.orientation)) return window.orientation;
            return 0;
        }

        function addDeviceOrbitDelta(dXz, dYz) {
            if (deviceOrbit.invert) {
                dXz = -dXz;
                dYz = -dYz;
            }
            const turn = -THREE.MathUtils.degToRad(screenAngleDeg());
            const cs = Math.cos(turn);
            const sn = Math.sin(turn);
            deviceOrbit.targetXz += dXz * cs - dYz * sn;
            deviceOrbit.targetYz += dXz * sn + dYz * cs;
        }

        function applyOrientationDelta(beta, gamma, alpha) {
            if (!Number.isFinite(beta) || !Number.isFinite(gamma)) return;
            if (deviceOrbit.prevBeta == null) {
                deviceOrbit.prevBeta = beta;
                deviceOrbit.prevGamma = gamma;
                deviceOrbit.prevAlpha = alpha;
                return;
            }
            const dBeta = shortestAngle(THREE.MathUtils.degToRad(beta - deviceOrbit.prevBeta));
            const dGamma = shortestAngle(THREE.MathUtils.degToRad(gamma - deviceOrbit.prevGamma));
            const dAlpha = Number.isFinite(alpha) && Number.isFinite(deviceOrbit.prevAlpha)
                ? shortestAngle(THREE.MathUtils.degToRad(alpha - deviceOrbit.prevAlpha))
                : 0;
            deviceOrbit.prevBeta = beta;
            deviceOrbit.prevGamma = gamma;
            deviceOrbit.prevAlpha = alpha;
            if (deviceOrbit.locked) return;
            if (Math.abs(dBeta) > 1 || Math.abs(dGamma) > 1 || Math.abs(dAlpha) > 1) return;
            addDeviceOrbitDelta(dGamma + dAlpha, -dBeta);
        }

        function applyGravitySample(x, y, z) {
            const len = Math.hypot(x, y, z);
            if (len < 4) return;
            const roll = Math.atan2(x / len, Math.max(0.12, -y / len));
            const pitch = Math.atan2(z / len, Math.max(0.12, -y / len));
            if (deviceOrbit.prevRoll == null) {
                deviceOrbit.prevRoll = roll;
                deviceOrbit.prevPitch = pitch;
                return;
            }
            const dRoll = shortestAngle(roll - deviceOrbit.prevRoll);
            const dPitch = shortestAngle(pitch - deviceOrbit.prevPitch);
            deviceOrbit.prevRoll = roll;
            deviceOrbit.prevPitch = pitch;
            if (deviceOrbit.locked) return;
            if (Math.abs(dRoll) > 1 || Math.abs(dPitch) > 1) return;
            addDeviceOrbitDelta(dRoll, -dPitch);
        }

        function onDeviceOrientation(event) {
            if (deviceOrbit.useGyro) return;
            if (event.beta == null || event.gamma == null) return;
            applyOrientationDelta(event.beta, event.gamma, event.alpha);
        }

        function onDeviceMotion(event) {
            const rate = event.rotationRate;
            if (rate && (Number.isFinite(rate.alpha) || Number.isFinite(rate.beta) || Number.isFinite(rate.gamma))) {
                deviceOrbit.useGyro = true;
                if (deviceOrbit.locked) return;
                const now = performance.now();
                let dt = deviceOrbit.lastMotionTime
                    ? (now - deviceOrbit.lastMotionTime) / 1000
                    : 1 / 60;
                deviceOrbit.lastMotionTime = now;
                if (dt < 0.004 || dt > 0.08) dt = 1 / 60;
                const yaw = THREE.MathUtils.degToRad(rate.alpha || 0) * dt;
                const pitch = THREE.MathUtils.degToRad(rate.beta || 0) * dt;
                const roll = THREE.MathUtils.degToRad(rate.gamma || 0) * dt;
                addDeviceOrbitDelta(-pitch, -(roll + yaw));
                return;
            }
            if (deviceOrbit.useGyro) return;
            const g = event.accelerationIncludingGravity;
            if (!g || g.x == null) return;
            applyGravitySample(g.x, g.y, g.z);
        }

        function startDeviceOrbitListeners() {
            if (deviceOrbit.listening) return;
            deviceOrbit.listening = true;
            window.addEventListener('deviceorientation', onDeviceOrientation, true);
            window.addEventListener('devicemotion', onDeviceMotion, true);
            window.addEventListener('orientationchange', forgetDevicePrev);
        }

        function needsMotionPermission() {
            return (typeof DeviceOrientationEvent !== 'undefined'
                    && typeof DeviceOrientationEvent.requestPermission === 'function')
                || (typeof DeviceMotionEvent !== 'undefined'
                    && typeof DeviceMotionEvent.requestPermission === 'function');
        }

        async function enableDeviceOrbit() {
            if (!deviceTiltOn() || deviceOrbit.listening) return;
            if (needsMotionPermission()) {
                let granted = false;
                try {
                    if (typeof DeviceMotionEvent.requestPermission === 'function') {
                        granted = await DeviceMotionEvent.requestPermission() === 'granted';
                    }
                    if (!granted && typeof DeviceOrientationEvent.requestPermission === 'function') {
                        granted = await DeviceOrientationEvent.requestPermission() === 'granted';
                    }
                } catch (_) {
                    return;
                }
                if (!granted) return;
            }
            startDeviceOrbitListeners();
        }

        function rotate4(v) {
            let [x, y, z, w] = v;
            let c, s, r;

            if (deviceOrbit.mode === 'xyz') {
                c = Math.cos(deviceOrbit.xz); s = Math.sin(deviceOrbit.xz);
                r = rotatePlane(x, z, c, s); x = r[0]; z = r[1];
                c = Math.cos(deviceOrbit.yz); s = Math.sin(deviceOrbit.yz);
                r = rotatePlane(y, z, c, s); y = r[0]; z = r[1];
            }

            c = Math.cos(angles.xy); s = Math.sin(angles.xy);
            r = rotatePlane(x, y, c, s); x = r[0]; y = r[1];

            c = Math.cos(angles.xz); s = Math.sin(angles.xz);
            r = rotatePlane(x, z, c, s); x = r[0]; z = r[1];

            c = Math.cos(angles.yz); s = Math.sin(angles.yz);
            r = rotatePlane(y, z, c, s); y = r[0]; z = r[1];

            if (deviceOrbit.mode === 'xw-yw') {
                c = Math.cos(deviceOrbit.xz); s = Math.sin(deviceOrbit.xz);
                r = rotatePlane(x, w, c, s); x = r[0]; w = r[1];
                c = Math.cos(deviceOrbit.yz); s = Math.sin(deviceOrbit.yz);
                r = rotatePlane(y, w, c, s); y = r[0]; w = r[1];
            } else if (deviceOrbit.mode === 'zw') {
                c = Math.cos(deviceOrbit.yz); s = Math.sin(deviceOrbit.yz);
                r = rotatePlane(z, w, c, s); z = r[0]; w = r[1];
            }

            c = Math.cos(angles.xw); s = Math.sin(angles.xw);
            r = rotatePlane(x, w, c, s); x = r[0]; w = r[1];

            c = Math.cos(angles.yw); s = Math.sin(angles.yw);
            r = rotatePlane(y, w, c, s); y = r[0]; w = r[1];

            c = Math.cos(angles.zw); s = Math.sin(angles.zw);
            r = rotatePlane(z, w, c, s); z = r[0]; w = r[1];

            return [x, y, z, w];
        }

        function project4to3(x, y, z, w) {
            const wFactor = 1 / Math.max(0.2, projectionDistance - w);
            return [x * wFactor, y * wFactor, z * wFactor];
        }

        function transform4(vertex) {
            return project4to3(...rotate4(vertex));
        }

        function makeCircleTexture() {
            const size = 64;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.35, 'rgba(255,255,255,0.9)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        function makeCubeMesh(colorHex) {
            const positions = new Float32Array(8 * 3);
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setIndex(CUBE_FACE_INDICES);
            const material = new THREE.MeshBasicMaterial({
                color: colorHex,
                transparent: true,
                opacity: 0.32,
                side: THREE.DoubleSide,
                depthWrite: false,
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.renderOrder = 1;
            return { mesh, positions, geometry };
        }

        const cubeNeg = makeCubeMesh(0x3d8cff);
        const cubePos = makeCubeMesh(0xff4d6d);
        scene.add(cubeNeg.mesh, cubePos.mesh);

        const cubeLinePositions = new Float32Array(cubeEdges.length * 6);
        const cubeLineColors = new Float32Array(cubeEdges.length * 6);
        const cubeLineGeometry = new THREE.BufferGeometry();
        cubeLineGeometry.setAttribute('position', new THREE.BufferAttribute(cubeLinePositions, 3));
        cubeLineGeometry.setAttribute('color', new THREE.BufferAttribute(cubeLineColors, 3));
        const cubeLines = new THREE.LineSegments(
            cubeLineGeometry,
            new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.95 })
        );
        scene.add(cubeLines);

        const wLinePositions = new Float32Array(wEdges.length * 6);
        const wLineColors = new Float32Array(wEdges.length * 6);
        const wLineGeometry = new THREE.BufferGeometry();
        wLineGeometry.setAttribute('position', new THREE.BufferAttribute(wLinePositions, 3));
        wLineGeometry.setAttribute('color', new THREE.BufferAttribute(wLineColors, 3));
        const wLines = new THREE.LineSegments(
            wLineGeometry,
            new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.85 })
        );
        scene.add(wLines);

        const pointPositions = new Float32Array(vertices4.length * 3);
        const pointColors = new Float32Array(vertices4.length * 3);
        const pointGeometry = new THREE.BufferGeometry();
        pointGeometry.setAttribute('position', new THREE.BufferAttribute(pointPositions, 3));
        pointGeometry.setAttribute('color', new THREE.BufferAttribute(pointColors, 3));
        const points = new THREE.Points(
            pointGeometry,
            new THREE.PointsMaterial({
                vertexColors: true,
                size: 0.11,
                sizeAttenuation: true,
                map: makeCircleTexture(),
                transparent: true,
                depthWrite: false,
            })
        );
        scene.add(points);

        const sliceLinePositions = new Float32Array(MAX_SLICES * CUBE_EDGES.length * 6);
        const sliceLineColors = new Float32Array(MAX_SLICES * CUBE_EDGES.length * 6);
        const sliceGeometry = new THREE.BufferGeometry();
        sliceGeometry.setAttribute('position', new THREE.BufferAttribute(sliceLinePositions, 3));
        sliceGeometry.setAttribute('color', new THREE.BufferAttribute(sliceLineColors, 3));
        const sliceLines = new THREE.LineSegments(
            sliceGeometry,
            new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.7 })
        );
        sliceLines.visible = false;
        scene.add(sliceLines);

        function writeCubePositions(target, w) {
            for (let i = 0; i < 8; i++) {
                const [x, y, z] = cubeCorner(i);
                const p = transform4([x, y, z, w]);
                target[i * 3] = p[0];
                target[i * 3 + 1] = p[1];
                target[i * 3 + 2] = p[2];
            }
        }

        function updateGeometry() {
            const projected = vertices4.map(transform4);

            for (let i = 0; i < vertices4.length; i++) {
                const p = projected[i];
                const c = colorForObjectW(vertices4[i][3]);
                pointPositions[i * 3] = p[0];
                pointPositions[i * 3 + 1] = p[1];
                pointPositions[i * 3 + 2] = p[2];
                pointColors[i * 3] = c[0];
                pointColors[i * 3 + 1] = c[1];
                pointColors[i * 3 + 2] = c[2];
            }

            for (let e = 0; e < cubeEdges.length; e++) {
                const [i, j] = cubeEdges[e];
                const a = projected[i];
                const b = projected[j];
                const c = colorForObjectW(vertices4[i][3]);
                const o = e * 6;
                cubeLinePositions[o] = a[0];
                cubeLinePositions[o + 1] = a[1];
                cubeLinePositions[o + 2] = a[2];
                cubeLinePositions[o + 3] = b[0];
                cubeLinePositions[o + 4] = b[1];
                cubeLinePositions[o + 5] = b[2];
                cubeLineColors[o] = cubeLineColors[o + 3] = c[0];
                cubeLineColors[o + 1] = cubeLineColors[o + 4] = c[1];
                cubeLineColors[o + 2] = cubeLineColors[o + 5] = c[2];
            }

            for (let e = 0; e < wEdges.length; e++) {
                const [i, j] = wEdges[e];
                const a = projected[i];
                const b = projected[j];
                const ca = colorForObjectW(vertices4[i][3]);
                const cb = colorForObjectW(vertices4[j][3]);
                const o = e * 6;
                wLinePositions[o] = a[0];
                wLinePositions[o + 1] = a[1];
                wLinePositions[o + 2] = a[2];
                wLinePositions[o + 3] = b[0];
                wLinePositions[o + 4] = b[1];
                wLinePositions[o + 5] = b[2];
                wLineColors[o] = ca[0];
                wLineColors[o + 1] = ca[1];
                wLineColors[o + 2] = ca[2];
                wLineColors[o + 3] = cb[0];
                wLineColors[o + 4] = cb[1];
                wLineColors[o + 5] = cb[2];
            }

            writeCubePositions(cubeNeg.positions, -1);
            writeCubePositions(cubePos.positions, 1);
            cubeNeg.geometry.attributes.position.needsUpdate = true;
            cubePos.geometry.attributes.position.needsUpdate = true;
            cubeNeg.geometry.computeVertexNormals();
            cubePos.geometry.computeVertexNormals();
            cubeNeg.geometry.computeBoundingSphere();
            cubePos.geometry.computeBoundingSphere();
            cubeNeg.mesh.visible = fillCubes;
            cubePos.mesh.visible = fillCubes;
            wLines.material.opacity = fillCubes ? 0.7 : 0.9;

            sliceLines.visible = showSlices;
            if (showSlices) {
                let drawn = 0;
                for (let s = 0; s < sliceCount; s++) {
                    const t = sliceCount === 1 ? 0.5 : s / (sliceCount - 1);
                    const w = -1 + 2 * t;
                    if (fillCubes && Math.abs(Math.abs(w) - 1) < 1e-6) continue;
                    const color = lerpColor((w + 1) / 2);
                    const corners = [];
                    for (let i = 0; i < 8; i++) {
                        const [x, y, z] = cubeCorner(i);
                        corners.push(transform4([x, y, z, w]));
                    }
                    for (const [a, b] of CUBE_EDGES) {
                        const pa = corners[a];
                        const pb = corners[b];
                        const o = drawn * 6;
                        sliceLinePositions[o] = pa[0];
                        sliceLinePositions[o + 1] = pa[1];
                        sliceLinePositions[o + 2] = pa[2];
                        sliceLinePositions[o + 3] = pb[0];
                        sliceLinePositions[o + 4] = pb[1];
                        sliceLinePositions[o + 5] = pb[2];
                        sliceLineColors[o] = sliceLineColors[o + 3] = color[0];
                        sliceLineColors[o + 1] = sliceLineColors[o + 4] = color[1];
                        sliceLineColors[o + 2] = sliceLineColors[o + 5] = color[2];
                        drawn++;
                    }
                }
                sliceGeometry.setDrawRange(0, drawn * 2);
                sliceGeometry.attributes.position.needsUpdate = true;
                sliceGeometry.attributes.color.needsUpdate = true;
                sliceGeometry.computeBoundingSphere();
            }

            cubeLineGeometry.attributes.position.needsUpdate = true;
            cubeLineGeometry.attributes.color.needsUpdate = true;
            wLineGeometry.attributes.position.needsUpdate = true;
            wLineGeometry.attributes.color.needsUpdate = true;
            pointGeometry.attributes.position.needsUpdate = true;
            pointGeometry.attributes.color.needsUpdate = true;
            cubeLineGeometry.computeBoundingSphere();
            wLineGeometry.computeBoundingSphere();
            pointGeometry.computeBoundingSphere();
        }

        function drawArrow(ctx, x1, y1, x2, y2, color, width) {
            const angle = Math.atan2(y2 - y1, x2 - x1);
            const head = 8;
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - head * Math.cos(angle - 0.4), y2 - head * Math.sin(angle - 0.4));
            ctx.lineTo(x2 - head * Math.cos(angle + 0.4), y2 - head * Math.sin(angle + 0.4));
            ctx.closePath();
            ctx.fill();
        }

        function drawAxesHud() {
            const cssW = hudLayout.w;
            const cssH = hudLayout.h;
            const scale = hudLayout.scale;
            const cx = cssW / 2;
            const cy = cssH / 2 + 2;

            axesCtx.clearRect(0, 0, cssW, cssH);
            axesCtx.fillStyle = 'rgba(255,255,255,0.08)';
            axesCtx.beginPath();
            axesCtx.arc(cx, cy, 3, 0, Math.PI * 2);
            axesCtx.fill();

            const tips = AXIS_DEFS.map((def) => ({
                ...def,
                r: rotate4(def.v),
            }));
            tips.sort((a, b) => a.r[2] - b.r[2]);

            for (const tip of tips) {
                const [x, y, z] = tip.r;
                const len = Math.hypot(x, y);
                const x2 = cx + x * scale;
                const y2 = cy - y * scale;
                const toward = THREE.MathUtils.clamp((z + 1) / 2, 0, 1);
                axesCtx.globalAlpha = 0.4 + 0.6 * toward;

                if (len > 0.06) {
                    drawArrow(axesCtx, cx, cy, x2, y2, tip.color, 1.1 + 1.4 * toward);
                }

                if (len < 0.55) {
                    const radius = 5 + (0.55 - len) * 14;
                    axesCtx.strokeStyle = tip.color;
                    axesCtx.lineWidth = z >= 0 ? 2.4 : 1.2;
                    axesCtx.setLineDash(z >= 0 ? [] : [3, 3]);
                    axesCtx.beginPath();
                    axesCtx.arc(cx, cy, radius, 0, Math.PI * 2);
                    axesCtx.stroke();
                    axesCtx.setLineDash([]);
                }

                axesCtx.font = 'bold 12px sans-serif';
                axesCtx.textAlign = 'center';
                axesCtx.textBaseline = 'middle';
                axesCtx.fillStyle = tip.color;
                if (len > 0.1) {
                    const ux = x / len;
                    const uy = y / len;
                    axesCtx.fillText(tip.label, x2 + ux * 12, y2 - uy * 12);
                } else {
                    axesCtx.fillText(tip.label, cx + 14, cy - 12);
                }
                axesCtx.globalAlpha = 1;
            }
        }

        function projectedRadius() {
            let maxR = 0.35;
            for (const v of vertices4) {
                const p = transform4(v);
                maxR = Math.max(maxR, Math.hypot(p[0], p[1], p[2]));
            }
            return maxR;
        }

        function applyCameraAspect() {
            const stereo = viewMode !== 'mono';
            const { width, height } = viewSize();
            const aspect = Math.max(0.08, stereo ? (width / 2) / height : width / height);
            camera.fov = 55;
            camera.aspect = aspect;
            const radius = projectedRadius() * 1.24 / cubeSize;
            const vHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5));
            const hHalf = vHalf * aspect;
            camera.position.set(0, 0, radius / Math.min(vHalf, hHalf));
            camera.lookAt(0, 0, 0);
            // Zero parallax at the object: changing eyeSep must not slide the cubes.
            camera.focus = camera.position.z;
            camera.updateProjectionMatrix();
        }

        function onResize() {
            const canvas = renderer.domElement;
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            const width = canvas.clientWidth || window.innerWidth;
            const height = canvas.clientHeight || window.innerHeight;
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(width, height, false);
            resizeAxesCanvas();
            applyCameraAspect();
        }

        function viewSize() {
            return {
                width: renderer.domElement.clientWidth || window.innerWidth,
                height: renderer.domElement.clientHeight || window.innerHeight,
            };
        }

        function renderEye(left, viewCamera) {
            const { width, height } = viewSize();
            const x = left ? 0 : width / 2;
            renderer.setScissor(x, 0, width / 2, height);
            renderer.setViewport(x, 0, width / 2, height);
            renderer.render(scene, viewCamera);
        }

        function renderFrame() {
            updateGeometry();
            applyCameraAspect();
            renderer.clear();
            camera.focus = camera.position.z;

            if (viewMode === 'mono') {
                const { width, height } = viewSize();
                renderer.setScissorTest(false);
                renderer.setViewport(0, 0, width, height);
                renderer.render(scene, camera);
                return;
            }

            stereoCamera.eyeSep = eyeSep * (camera.position.z / 5.4);
            stereoCamera.update(camera);

            renderer.setScissorTest(true);
            if (viewMode === 'cross') {
                renderEye(true, stereoCamera.cameraR);
                renderEye(false, stereoCamera.cameraL);
            } else {
                renderEye(true, stereoCamera.cameraL);
                renderEye(false, stereoCamera.cameraR);
            }
            renderer.setScissorTest(false);
        }

        function animate() {
            deviceOrbit.xz += (deviceOrbit.targetXz - deviceOrbit.xz) * 0.18;
            deviceOrbit.yz += (deviceOrbit.targetYz - deviceOrbit.yz) * 0.18;
            renderFrame();
            drawAxesHud();
            requestAnimationFrame(animate);
        }

        function isUiEvent(event) {
            return event.target instanceof Element && (
                event.target.closest('#ui-container') ||
                event.target.closest('#mode-bar') ||
                event.target.closest('#menu-toggle') ||
                event.target.closest('#menu-backdrop')
            );
        }

        function rotate3D(dx, dy) {
            angles.xz += dx * DRAG_SENSITIVITY;
            angles.yz += dy * DRAG_SENSITIVITY;
        }

        function rotate4D(dx, dy) {
            angles.xw += dx * DRAG_SENSITIVITY;
            angles.yw += dy * DRAG_SENSITIVITY;
        }

        function pinchPair() {
            const pts = [...activePointers.values()];
            if (pts.length < 2) return null;
            return {
                mid: { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 },
                dist: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y),
            };
        }

        window.addEventListener('pointerdown', (event) => {
            if (isUiEvent(event)) return;
            if (event.pointerType === 'mouse' && event.button !== 0) return;
            enableDeviceOrbit();
            event.preventDefault();
            activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
            renderer.domElement.classList.add('is-dragging');
            if (event.target === renderer.domElement) {
                try {
                    renderer.domElement.setPointerCapture(event.pointerId);
                } catch (_) { /* ignore */ }
            }
            const pair = pinchPair();
            if (pair) {
                lastMidpoint = pair.mid;
                lastPinchDist = pair.dist;
            }
            lockTiltAxis();
        });

        window.addEventListener('pointermove', (event) => {
            if (!activePointers.has(event.pointerId)) return;
            const prev = activePointers.get(event.pointerId);
            activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

            if (activePointers.size >= 2) {
                const pair = pinchPair();
                if (!pair) return;
                if (lastMidpoint) {
                    rotate4D(pair.mid.x - lastMidpoint.x, pair.mid.y - lastMidpoint.y);
                }
                if (lastPinchDist > 0) {
                    angles.zw += (pair.dist - lastPinchDist) * 0.012;
                }
                lastMidpoint = pair.mid;
                lastPinchDist = pair.dist;
                return;
            }

            const dx = event.clientX - prev.x;
            const dy = event.clientY - prev.y;
            if (event.shiftKey) rotate4D(dx, dy);
            else rotate3D(dx, dy);
        });

        function endPointer(event) {
            if (!activePointers.has(event.pointerId)) return;
            activePointers.delete(event.pointerId);
            if (activePointers.size < 2) {
                lastMidpoint = null;
                lastPinchDist = 0;
            }
            if (activePointers.size === 0) {
                renderer.domElement.classList.remove('is-dragging');
                unlockTiltAxis();
            }
        }

        window.addEventListener('pointerup', endPointer);
        window.addEventListener('pointercancel', endPointer);
        window.addEventListener('pointerleave', (event) => {
            if (event.pointerType === 'mouse') endPointer(event);
        });

        let lastGestureScale = 1;

        window.addEventListener('wheel', (event) => {
            if (isUiEvent(event)) return;
            event.preventDefault();

            const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerHeight : 1;
            const dx = event.deltaX * unit;
            const dy = event.deltaY * unit;

            // Pinch-to-zoom on Mac Chrome is wheel + ctrlKey.
            if (event.ctrlKey) {
                if (lastGestureScale === 1) {
                    angles.zw += dy * WHEEL_SENSITIVITY;
                }
                return;
            }

            if (event.shiftKey) {
                angles.zw += dy * WHEEL_SENSITIVITY;
                return;
            }

            angles.xw += dx * WHEEL_PAN_SENSITIVITY;
            angles.yw += dy * WHEEL_PAN_SENSITIVITY;
        }, { passive: false });

        window.addEventListener('gesturestart', (event) => {
            if (isUiEvent(event)) return;
            event.preventDefault();
            lastGestureScale = event.scale || 1;
        });

        window.addEventListener('gesturechange', (event) => {
            if (isUiEvent(event)) return;
            event.preventDefault();
            const scale = event.scale || 1;
            angles.zw += (scale - lastGestureScale) * 1.4;
            lastGestureScale = scale;
        });

        window.addEventListener('gestureend', (event) => {
            lastGestureScale = 1;
            if (isUiEvent(event)) return;
            event.preventDefault();
        });

        const stereoHint = document.getElementById('stereoHint');
        const sliceControls = document.getElementById('sliceControls');
        const eyeSepSlider = document.getElementById('eyeSepSlider');
        const focusSlider = document.getElementById('focusSlider');
        const cubeSizeSlider = document.getElementById('cubeSizeSlider');
        const eyeSepValue = document.getElementById('eyeSepValue');
        const focusValue = document.getElementById('focusValue');
        const cubeSizeValue = document.getElementById('cubeSizeValue');
        const sliceCountSlider = document.getElementById('sliceCountSlider');
        const sliceCountValue = document.getElementById('sliceCountValue');
        const menuToggle = document.getElementById('menu-toggle');
        const menuBackdrop = document.getElementById('menu-backdrop');
        const uiContainer = document.getElementById('ui-container');

        function setMenuOpen(open) {
            uiContainer.classList.toggle('is-open', open);
            menuToggle.classList.toggle('is-open', open);
            menuBackdrop.classList.toggle('is-on', open);
            menuToggle.setAttribute('aria-expanded', String(open));
        }

        function isCompactLayout() {
            return window.matchMedia('(max-width: 900px), (max-height: 520px)').matches;
        }

        menuToggle.addEventListener('click', (event) => {
            event.stopPropagation();
            enableDeviceOrbit();
            setMenuOpen(!uiContainer.classList.contains('is-open'));
        });

        menuBackdrop.addEventListener('click', () => setMenuOpen(false));

        function formatNum(value) {
            return Number(value).toFixed(2);
        }

        function setViewMode(mode) {
            viewMode = mode;
            document.body.classList.toggle('is-mono', mode === 'mono');
            document.querySelectorAll('#mode-bar button').forEach((button) => {
                button.classList.toggle('is-active', button.dataset.mode === mode);
            });
            stereoHint.textContent = mode === 'cross'
                ? 'Cross your eyes until the two images merge into one.'
                : mode === 'parallel'
                    ? 'Look through the screen, as if into the distance — left eye on the left image.'
                    : 'Single view.';
            applyCameraAspect();
        }

        document.getElementById('mode-bar').addEventListener('click', (event) => {
            const button = event.target.closest('button[data-mode]');
            if (!button) return;
            setViewMode(button.dataset.mode);
        });

        const tiltModeSelect = document.getElementById('tiltModeSelect');
        const tiltInvert = document.getElementById('tiltInvert');
        const tiltInvertGroup = document.getElementById('tiltInvertGroup');

        function syncTiltControls() {
            tiltModeSelect.value = deviceOrbit.mode;
            tiltInvert.checked = deviceOrbit.invert;
            tiltInvertGroup.style.display = deviceTiltOn() ? '' : 'none';
        }

        tiltModeSelect.addEventListener('change', () => {
            deviceOrbit.mode = tiltModeSelect.value;
            resetDeviceOrbit();
            syncTiltControls();
            enableDeviceOrbit();
        });

        tiltInvert.addEventListener('change', () => {
            deviceOrbit.invert = tiltInvert.checked;
        });

        document.getElementById('fillToggle').addEventListener('change', (event) => {
            fillCubes = event.target.checked;
        });

        document.getElementById('sliceToggle').addEventListener('change', (event) => {
            showSlices = event.target.checked;
            sliceControls.classList.toggle('is-open', showSlices);
        });

        sliceCountSlider.addEventListener('input', () => {
            sliceCount = Number(sliceCountSlider.value);
            sliceCountValue.textContent = String(sliceCount);
        });

        cubeSizeSlider.addEventListener('input', () => {
            cubeSize = Number(cubeSizeSlider.value);
            cubeSizeValue.textContent = formatNum(cubeSize);
        });

        eyeSepSlider.addEventListener('input', () => {
            eyeSep = Number(eyeSepSlider.value);
            eyeSepValue.textContent = formatNum(eyeSep);
        });

        focusSlider.addEventListener('input', () => {
            projectionDistance = Number(focusSlider.value);
            focusValue.textContent = formatNum(projectionDistance);
        });

        window.addEventListener('resize', onResize);

        setMenuOpen(!isCompactLayout());
        syncTiltControls();
        if (deviceTiltOn() && !needsMotionPermission()) startDeviceOrbitListeners();
        onResize();
        updateGeometry();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
