<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142522">
  <meta name="description" content="Shape the terrain, move and resize cities, and watch a road network find its way through the landscape. A WebGL playground.">
  <title>Hive — Cities & Roads</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23142522'/%3E%3Cpath d='M10 34 24 12 38 30' stroke='%23e8bd73' stroke-width='2' fill='none'/%3E%3Ccircle cx='24' cy='12' r='6' fill='%23a3dacd'/%3E%3Ccircle cx='10' cy='34' r='4' fill='%23a3dacd'/%3E%3Ccircle cx='38' cy='30' r='4' fill='%23a3dacd'/%3E%3C/svg%3E">
  <script type="module" src="./assets/hive-CyDp1zn6.js"></script>
  <link rel="stylesheet" href="./assets/hive-B5zS1aOA.css">
</head>
<body>
  <canvas id="field" aria-label="Editable landscape with draggable, resizable cities and adaptive roads" tabindex="0"></canvas>
  <div class="summary"><span id="summary">9 cities</span><span id="routing-state" role="status">Agents exploring</span></div>
  <div class="top-actions"><button id="pause" aria-pressed="false">Pause</button><button id="settings-toggle" aria-expanded="false" aria-controls="settings">Settings ☷</button></div>
  <aside id="selection" hidden aria-label="Selected city">
    <div class="selection-head"><strong id="city-name"></strong><button id="remove-city" title="Delete selected city">Remove</button></div>
    <label for="diameter">Diameter <output id="diameter-value"></output></label>
    <input type="range" id="diameter" min="4" max="24" step="0.1">
    <p id="city-connections"></p>
  </aside>
  <aside id="settings" hidden aria-label="Road and landscape settings">
    <div class="panel-heading"><h2>Conditions</h2><button id="settings-close" aria-label="Close settings">×</button></div>
    <div id="controls"></div>
    <p class="panel-note">Agents walk between city pairs. They explore, avoid costly slopes and follow fading traces. Paths emerge from their footsteps. Larger cities participate in more pairs.</p>
    <div class="reset-actions"><button id="reset-roads">Reset roads</button><button id="new-terrain">New terrain</button><button id="clear-cities">Clear cities</button></div>
  </aside>
  <div class="view-switch" role="group" aria-label="Map layers"><button data-view="0" aria-pressed="true">Together</button><button data-view="1" aria-pressed="false">Terrain</button><button data-view="2" aria-pressed="false">Roads</button></div>
  <div class="bottom-bar"><div class="tools" role="group" aria-label="Map tools"><button data-tool="move" aria-pressed="true">Move</button><button data-tool="city" aria-pressed="false">Add city</button><button data-tool="raise" aria-pressed="false">Raise</button><button data-tool="lower" aria-pressed="false">Lower</button><button id="speed" title="Simulation speed">1×</button><button id="fit">Fit</button></div></div>
  <div class="hint" id="hint">Drag a city to move · drag its rim to resize · drag empty ground to pan</div>
  <div id="notice" role="status"></div>
  <div id="fatal-error" role="alert" hidden></div>
</body>
</html>
